# Reject texture fetch constants with the "invalid" type, as the console does. Accepting them
# drew stale textures (a WrestleMania XXX sign in other arenas, black patches on skin, red-tinted
# crowds in victory scenes). The SDK patch rexglue-sdk-texture-fetch-log-once.patch logs each
# distinct rejected constant once, which removes the log flood this option used to avoid.
gpu_allow_invalid_fetch_constants = false

# Keep Vulkan's automatic device selection. On NVIDIA Optimus laptops the
# executable requests the high-performance adapter through NvOptimusEnablement.
vulkan_device = -1

# Compile shaders asynchronously so first-use pipelines do not stall the game.
async_shader_compilation = true

# Apply the NVIDIA alpha-test epsilon to Vulkan to reduce edge flicker.
use_fuzzy_alpha_epsilon = true

# D3D12 hung on this title; use the Vulkan backend from the same Xenos plugin.
gpu_backend = "vulkan"

# Avoid a sync wait forcing slow frame-rate steps when the emulator cannot hold 60 FPS.
gpu_vsync = false

# Emulate EDRAM with fragment shader interlock instead of host render targets. The host-RT
# path showed fully black frames during entrances (thousands of draws per frame still
# issued, so the scene was rendered but lost in EDRAM aliasing); FSI renders them correctly
# at the same frame rate on NVIDIA. GPUs without VK_EXT_fragment_shader_interlock fall back.
render_target_path_vulkan = "fsi"

# Superstar Threads (and created superstars) build attire and skin textures on the GPU, then the
# CPU reads them back to compress them in DXT. Without readback it compressed stale memory:
# attire in scrambled colour bands. "full" copies each resolve back at once; the SDK patch
# rexglue-sdk-readback-resolve.patch limits it to these formats (k_8, k_8_8_8_8, k_4_4_4_4) and
# skips 16:9 screen-shaped targets (by shape: a 1024x1024 attire level 0 must be read back, or
# close-ups stay scrambled) and targets redrawn in 60 frames in a row (about 38 per frame in a
# match, GPU-only work), so matches stay at 60 FPS.
readback_resolve = "full"
readback_resolve_formats = "2,6,15"
readback_resolve_repeat_limit = 60

# Present without tearing: the SDK prefers the "immediate" mode (no vertical sync, visible tears).
# Mailbox keeps latency low without tearing. The launcher's vertical sync box sets this.
vulkan_allow_present_mode_immediate = false
